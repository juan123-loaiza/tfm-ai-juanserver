name: Deploy Frontend DEV

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Deploy via SSH to DEV
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST_DEV }}
          username: ${{ secrets.VPS_USER_DEV }}
          key: ${{ secrets.VPS_SSH_KEY_DEV }}
          script: |
            cd /home/juanes/repositories/repos_dev/frontend-dev
            git pull
            cd /home/juanes/repositories/repos_dev
            docker compose -f docker-compose-dev.yml up -d --no-deps --build frontend-dev
